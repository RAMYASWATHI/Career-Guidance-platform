{% extends "base.html" %}

{% block title %}Contact Us - CAREER GUIDANCE PLATFORM{% endblock %}

{% block content %}
<section class="section" style="background: linear-gradient(180deg, #f0f4ff 0%, #f8fafc 100%); padding: 48px 0 36px 0; border-bottom: 1px solid var(--border-color);">
    <div class="container container-narrow text-center">
        <span class="badge badge-primary" style="margin-bottom: 8px;"><i class="fas fa-headset"></i> Support</span>
        <h1 style="margin-bottom: 10px;">Contact Us</h1>
        <p style="max-width: 620px; margin: 0 auto;">
            Have questions about career paths, learning roadmaps, or placement preparation? We are here to assist you.
        </p>
    </div>
</section>

<section class="section">
    <div class="container container-narrow">
        <div class="card" style="padding: 32px 36px;">
            <form action="{{ url_for('career.contact_submit') }}" method="POST">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="contact_name">Full Name *</label>
                        <input type="text" id="contact_name" name="name" class="form-control" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="contact_email">Email Address *</label>
                        <input type="email" id="contact_email" name="email" class="form-control" required autocomplete="off">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="contact_college">College / University</label>
                        <input type="text" id="contact_college" name="college" class="form-control" placeholder="Enter your college / university name">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="contact_subject">Inquiry Subject</label>
                        <select id="contact_subject" name="subject" class="form-select">
                            <option value="Career Assessment">Career Assessment Guidance</option>
                            <option value="Roadmap Advice">Learning Roadmap Query</option>
                            <option value="Interview Preparation">Interview Preparation Question</option>
                            <option value="Technical Skills">Technical Skills Guidance</option>
                            <option value="Other">General Inquiry</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="contact_message">Your Message *</label>
                    <textarea id="contact_message" name="message" class="form-control form-textarea" rows="4" placeholder="Enter your message here..." required></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" id="contact-submit-btn">
                    <i class="fas fa-paper-plane"></i> Send Message
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
