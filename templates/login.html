{% extends "base.html" %}

{% block title %}Sign In - CAREER GUIDANCE PLATFORM{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <span class="badge badge-purple"><i class="fas fa-lock"></i> Account Sign In</span>
            <h2>Welcome Back</h2>
            <p>Sign in to access your student dashboard, assessment results, and roadmaps.</p>
        </div>

        <form action="{{ url_for('auth.login') }}" method="POST" id="loginForm" autocomplete="off">
            <div class="form-group">
                <label class="form-label" for="login_email">Email Address</label>
                <input type="email" id="login_email" name="email" class="form-control" required value="{{ request.form.get('email', '') }}" autocomplete="off">
            </div>

            <div class="form-group">
                <label class="form-label" for="login_password">Password</label>
                <input type="password" id="login_password" name="password" class="form-control" required autocomplete="current-password">
            </div>

            <div style="margin-top: 12px;">
                <button type="submit" class="btn btn-primary btn-lg btn-block" id="login-submit-btn">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </div>

            <p style="text-align: center; margin-top: 20px; font-size: 0.92rem;">
                Don't have an account yet? <a href="{{ url_for('auth.register') }}" style="font-weight: 700;">Register as Student &rarr;</a>
            </p>
        </form>
    </div>
</div>
{% endblock %}
